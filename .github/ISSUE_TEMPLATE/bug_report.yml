name: Bug report
description: Report a reproducible software or forecast-product problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Explain the problem. For forecast cases, distinguish observations from model output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, date, event, coordinates, and source mode where relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, package version or commit, and installation method.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and metadata
      description: Include relevant JSON metadata and verbose errors. Remove credentials and private information.
