[project]
name = "firecloud-forecast"
version = "0.1.0"
description = "Explainable sunrise and sunset glow condition forecasting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["weather", "sunrise", "sunset", "forecast", "atmospheric-science"]
requires-python = ">=3.11"
dependencies = [
    "herbie-data>=2024.8.0",
    "xarray>=2024.6.0",
    "cfgrib>=0.9.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "cartopy>=0.23",
    "astral>=3.2",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/NickZhuxy/firecloud-forecast"
Documentation = "https://github.com/NickZhuxy/firecloud-forecast/tree/main/docs"
Issues = "https://github.com/NickZhuxy/firecloud-forecast/issues"

[project.scripts]
firecloud = "predictor.cli:main"

[project.optional-dependencies]
satellite = [
    "satpy>=0.49",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["predictor"]
exclude = ["predictor/tests/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/predictor",
    "/docs/*.md",
    "/examples/shanghai-sunset",
    "/examples/new-york-sunset",
    "/research/README.md",
    "/research/methodology.md",
    "/research/experiments",
    "/research/paper/README.md",
    "/research/paper/Makefile",
    "/research/paper/*.tex",
    "/research/paper/*.bib",
    "/research/paper/figures/*.py",
    "/research/paper/figures/*.png",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["predictor/tests"]
# Default run stays offline: network tests opt in via `pytest -m integration`
# (a later -m overrides this addopts value). Without this, slow GFS/S3 mirrors
# hang the default suite (#89).
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests requiring network (deselect with -m 'not integration')",
]
